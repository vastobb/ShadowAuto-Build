plugins {
    id "com.android.application"
}

android {
    namespace = "com.phantom.automation"
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.phantom.automation"
        minSdk = 29
        targetSdk = 36
        versionCode = 2
        versionName = "0.2"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def shizukuVersion = "13.1.5"

dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.android.material:material:1.10.0"
    implementation "dev.rikka.shizuku:api:${shizukuVersion}"
    implementation "dev.rikka.shizuku:provider:${shizukuVersion}"
    compileOnly project(":android-stubs")
    // PaddleOCR Java API (native libs + models are provisioned on demand;
    // compile only needs the Java stubs, same as the legacy shell module).
    implementation project(":paddler-ocr")
    testImplementation "junit:junit:4.13.2"
}
