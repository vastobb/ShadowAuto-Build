name: Build APK (cloud, no local build)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --licenses <<< "y" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (fast, no OCR native deps)
        run: ./gradlew :android-shell:assembleDebug :controller-app:assembleDebug -PenablePaddleLiteOcr=false --stacktrace --info

      - name: List APK outputs
        if: always()
        run: |
          find . -type f -name "*.apk" | head -n 50
          ls -lh android-shell/build/outputs/apk/debug/ controller-app/build/outputs/apk/debug/ || true

      - name: Upload shell APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-shell-debug
          path: android-shell/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload controller APK
        uses: actions/upload-artifact@v4
        with:
          name: controller-app-debug
          path: controller-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
