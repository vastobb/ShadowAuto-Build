name: Build APK (cloud, no local build)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (fast, no OCR native deps)
        run: ./gradlew :android-shell:assembleDebug :controller-app:assembleDebug -PenablePaddleLiteOcr=false --stacktrace

      - name: List APK outputs
        if: always()
        run: |
          find . -type f -name "*.apk" | head -n 50
          ls -lh android-shell/build/outputs/apk/debug/ controller-app/build/outputs/apk/debug/ || true

      - name: Upload shell APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-shell-debug
          path: android-shell/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload controller APK
        uses: actions/upload-artifact@v4
        with:
          name: controller-app-debug
          path: controller-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
