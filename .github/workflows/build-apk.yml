name: Build APK (cloud, no local build)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (fast, no OCR native deps)
        run: ./gradlew :android-shell:assembleDebug :controller-app:assembleDebug :phantom-app:assembleDebug -PenablePaddleLiteOcr=false --stacktrace

      - name: Phantom unit tests (JVM, no device)
        run: ./gradlew :phantom-app:testDebugUnitTest -PenablePaddleLiteOcr=false --stacktrace

      - name: List APK outputs
        if: always()
        run: |
          find . -type f -name "*.apk" | head -n 50
          ls -lh android-shell/build/outputs/apk/debug/ controller-app/build/outputs/apk/debug/ phantom-app/build/outputs/apk/debug/ || true

      - name: Upload shell APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-shell-debug
          path: android-shell/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload controller APK
        uses: actions/upload-artifact@v4
        with:
          name: controller-app-debug
          path: controller-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Phantom APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-app-debug
          path: phantom-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify Phantom identity in APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt2
          APK=phantom-app/build/outputs/apk/debug/phantom-app-debug.apk
          $AAPT dump badging "$APK" | tee badging.txt | head -n 12
          grep -q "application-label:'Phantom'" badging.txt
          grep -q "launchable-activity:.*label='Phantom'" badging.txt
          for res in ic_launcher_foreground ic_nav_home ic_nav_sessions ic_nav_apps ic_nav_inspect ic_nav_settings bottom_nav; do
            unzip -l "$APK" | grep -q "$res" || { echo "missing resource: $res"; exit 1; }
          done
          echo "identity check passed"
